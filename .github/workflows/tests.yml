name: Tests

on:
  push:
    branches: [main]
  # release/** as well: a patch release is a PR into release/0.N.x, and without this
  # the first check it got was the tag push.
  pull_request:
    branches: [main, 'release/**']

# The actual job definitions live in ci.yml (a reusable workflow) so that
# release.yml's pre-publish gate runs the exact same checks as every ordinary
# push -- one definition, two callers, nothing to keep in sync by hand.
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
