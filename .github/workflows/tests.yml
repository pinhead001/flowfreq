name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The actual job definitions live in ci.yml (a reusable workflow) so that
# release.yml's pre-publish gate runs the exact same checks as every ordinary
# push -- one definition, two callers, nothing to keep in sync by hand.
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
