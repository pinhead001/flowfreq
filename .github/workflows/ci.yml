name: CI

# Reusable workflow: the one definition of "what CI checks" for this repo.
# tests.yml calls this on every push/PR; release.yml calls the exact same
# jobs as its gate before publishing. Two callers, one definition, so the
# release gate cannot silently drift from day-to-day CI the way a
# hand-copied second workflow eventually would.
on:
  workflow_call:

# lint and test are independent on purpose. They used to be chained with
# `needs: lint`, which meant a formatting failure stopped the suite from
# running at all -- and that is how a ModuleNotFoundError across five test
# modules went unnoticed from February to August 2026. A style nit must never
# be able to hide a broken build.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      # The dev extra, not a bare `pip install black isort`. This job used to
      # install the linters unpinned, so it ran black 26 while pyproject pins
      # black<25 and every other job installs the pins -- code formatted to
      # the declared contract was then rejected by CI, and code CI accepted
      # failed for anyone who had installed .[dev]. The comment below claimed
      # the two could not drift; installing different versions is exactly how
      # they drifted.
      - name: Install linters
        run: pip install -e ".[dev]"

      # Same target, and now the same versions, as a developer who installed
      # the dev extra.
      - name: Lint
        run: make lint

      # Enforced on the modules that already pass; the rest are exempted
      # individually in pyproject.toml so the debt is countable. The library
      # ships py.typed, so downstream checkers trust these annotations -- this
      # is what makes that promise mean something.
      - name: Typecheck
        run: make typecheck

      # Standing replacement for the one-time manual CVE sweep done in the
      # pre-publish security review (see the floor-raising commits on
      # requests/pyarrow/setuptools): that check only caught what was known
      # the day it ran. This catches the next one, on every push.
      #
      # Scoped to a clean install of the base package, not this job's own
      # `.[dev]` environment: black and pytest are deliberately pinned below
      # their latest patch (black<25, pytest<8 -- see the dev extra's own
      # comments on why) and pip itself is just this runner's bootstrap
      # tooling, not a flowfreq dependency. None of those three reach a `pip
      # install flowfreq` user, so a CVE in them would fail this gate for a
      # supply-chain risk nobody actually ships. Auditing a throwaway venv
      # holding only what `pip install .` pulls in is what's actually being
      # published.
      - name: Audit runtime dependencies for known vulnerabilities
        run: |
          python -m venv /tmp/audit-env
          /tmp/audit-env/bin/pip install -q .
          /tmp/audit-env/bin/pip list --format=freeze \
            --exclude pip --exclude setuptools --exclude wheel --exclude flowfreq \
            > /tmp/audit-reqs.txt
          # Pinned like every other tool here (black<25, pytest<9): unpinned,
          # pip-audit could change scan behavior between runs with no diff in
          # this repo to review, which is exactly the non-reproducibility the
          # pins above this step exist to prevent.
          pip install "pip-audit>=2.10.1,<3"
          pip-audit -r /tmp/audit-reqs.txt

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      # No marker flags here: the default selection lives in pyproject.toml's
      # addopts, so this runs exactly what a developer's bare `pytest` runs.
      - name: Test
        run: pytest tests/

      # pytest-cov has been a declared dev dependency that nothing ever
      # invoked, so coverage was unmeasured rather than known. One leg of the
      # matrix is enough; running it on all four would quadruple the cost to
      # produce the same number.
      - name: Coverage
        if: matrix.python-version == '3.12'
        run: make cov


  # tests/fortran_parity/test_live_vs_golden.py is the only thing standing
  # between a golden file and silent drift from vendor/peakfqr. It needs the
  # f2py extension, no other job has a Fortran toolchain, so until now it
  # skipped everywhere in CI and drift would surface months later on whichever
  # machine happened to have gfortran. This job gives it one.
  fortran:
    name: Fortran parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran

      # meson and ninja are the f2py build backend, not runtime dependencies,
      # so they are installed here rather than added to the dev extra.
      - name: Install
        run: pip install -e ".[dev]" meson ninja

      # Same target a developer runs, so the two cannot drift. It builds, then
      # asserts the extension imports before running the parity tests -- without
      # that assertion a failed build would merely skip them and report green.
      - name: Build and check parity
        run: make parity
