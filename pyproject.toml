[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowfreq"
version = "0.6.0"
description = "Python library for hydrologic analysis with Bulletin 17C flood frequency"
readme = "README.md"
authors = [{name = "pinhead001", email = "pinhead001@github.com"}]
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Hydrology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["hydrology", "flood-frequency", "bulletin-17c", "usgs", "streamflow"]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "scipy>=1.7.0",
    "requests>=2.25.0",
    "click>=8.0",
    "pyarrow>=10.0",
    # Pure Python, no compiled extension. flowfreq._p3_moments needs it for
    # the var_mom port's truncated-moment computation: at-site skew near
    # zero (the common case) makes the Pearson III shape parameter
    # alpha = 4/skew**2 large enough (Big Sandy: ~9e4) that float64 loses
    # the moment computation to cancellation. See _GAMMA_MOMENT_DPS there.
    "mpmath>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<8",
    "pytest-cov>=4.0,<5",
    "black>=24.0,<25",
    "isort>=5.12,<6",
    "flake8>=6.0,<7",
    "bump2version>=1.0.0,<2",
    # No upper bound: <2 is what made CI install 1.x while a developer on 2.x
    # saw different behaviour from the same config.
    "mypy>=1.8",
    "pandas-stubs",
    "types-requests",
]

[project.scripts]
flowfreq = "flowfreq.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["flowfreq*"]

[tool.setuptools.package-data]
# py.typed is the PEP 561 marker. Without it a downstream type checker ignores
# every annotation in this package, so the type hints are invisible to the
# people they exist for.
#
# The gage table used to be shipped as "../data/*.csv" from a top-level data/
# directory, a package-data entry reaching outside the package it belongs to.
# It happened to work; it is not contractual, and it forced data* into
# packages.find above. The file now lives in flowfreq/data/ where it is
# addressed normally.
"flowfreq" = ["data/*.csv", "py.typed"]
# Benchmark cases must ship with the package: flowfreq benchmark used to read
# them out of tests/, which is not packaged, so the command failed for every
# installed user.
"flowfreq.validation" = ["data/*.json"]

[tool.mypy]
# No python_version pin. Setting it to 3.9 -- the runtime floor -- makes mypy
# parse *dependency* source under 3.9 grammar too, and click uses a match
# statement, so the run dies on click/utils.py before checking any of our code.
# mypy 2.x refuses the setting outright (3.10 is its floor), which is how this
# passed locally on 2.3.1 while failing CI on the 1.x the dev extra pinned:
# 2.x warned and ignored it, 1.x honoured it and broke. Runtime 3.9 support is
# covered by the test matrix, which is the stronger check anyway.
ignore_missing_imports = true
# Enforced on the modules that already pass, so no NEW type error can land in
# them. The library ships py.typed, which tells every downstream checker to
# trust these annotations -- that promise is worth something only if something
# checks it.
#
# The modules listed below still carry errors inherited from before mypy ran
# here at all (14 files). They are exempted individually rather than by
# loosening the global settings, so the debt is countable and shrinks by
# deleting a stanza: pick a module, fix it, remove its override. Nothing new
# gets added to this list -- a new module is checked by default.
#
# Deliberately not fixed wholesale: over 200 errors concentrated in the
# numerical core, which is validated against the vendored Fortran to 1e-8. A
# large mechanical retype there risks a behaviour change no type checker would
# catch, for a benefit no user sees.

[[tool.mypy.overrides]]
module = "flowfreq"
ignore_errors = true

[[tool.mypy.overrides]]
module = "flowfreq._var_mom"
ignore_errors = true

[[tool.mypy.overrides]]
module = "flowfreq.batch"
ignore_errors = true

[[tool.mypy.overrides]]
module = "flowfreq.bulletin17c"
ignore_errors = true

[[tool.mypy.overrides]]
module = "flowfreq.flowio"
ignore_errors = true

[[tool.mypy.overrides]]
module = "flowfreq.freq_plot"
ignore_errors = true

[[tool.mypy.overrides]]
module = "flowfreq.hydrograph"
ignore_errors = true

[[tool.mypy.overrides]]
module = "flowfreq.lowflow"
ignore_errors = true

[[tool.mypy.overrides]]
module = "flowfreq.regime"
ignore_errors = true

[[tool.mypy.overrides]]
module = "flowfreq.report"
ignore_errors = true

[[tool.mypy.overrides]]
module = "flowfreq.usgs"
ignore_errors = true

[[tool.mypy.overrides]]
module = "flowfreq.validation.benchmarks"
ignore_errors = true

[[tool.mypy.overrides]]
module = "flowfreq.validation.reference"
ignore_errors = true

[[tool.mypy.overrides]]
module = "flowfreq.workflow"
ignore_errors = true

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["flowfreq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# The default selection IS the CI selection, so a bare `pytest` is correct on
# every platform with nothing to remember and no `make` required. Override from
# the CLI when you want the excluded tests: `-m ""` runs everything,
# `-m requires_network` runs only those. A later -m always wins.
#
# requires_peakfqr_testdata is deliberately NOT excluded: the reference data is
# vendored at vendor/peakfqr/inst/testdata, those tests pass, and
# tests/fixtures/paths.py skips them cleanly if it is ever absent.
#
# requires_peakfqsa is gone with flowfreq/peakfqsa: the marker gated two empty
# stub classes, so `pytest -m requires_peakfqsa` collected zero tests and both
# the marker and its exclusion were dead config.
addopts = "-v -m 'not requires_network'"
markers = [
    "requires_network: marks tests that contact live NWIS services (deselect with '-m \"not requires_network\"')",
    "requires_fortran: marks tests needing the f2py Fortran extension (auto-skipped when absent; build with python build_fortran/build.py)",
    "requires_peakfqr_testdata: marks tests needing the peakfqr reference test data, searched under vendor/peakfqr then ../_shared/peakfqr; auto-skipped when absent, see docs/FORTRAN_UPLOAD.md",
]
