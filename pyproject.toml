[build-system]
# >=83.0.0: pip-audit flagged the previous >=45 floor during the pre-publish
# security review -- it permits every setuptools release with PYSEC-2026-3447,
# fixed in 83.0.0. This only pins what pip fetches into the isolated build
# environment when the sdist/wheel are built; it does not require a
# contributor's own installed setuptools to be this new.
# >=83.0.0 also happens to be needed for the PEP 639 license fields below
# (license = "<SPDX expr>", license-files) -- that support landed at 77.0.0,
# well under the CVE floor already required.
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowfreq"
version = "0.7.0"
description = "Python library for hydrologic analysis with Bulletin 17C flood frequency"
readme = "README.md"
authors = [{name = "pinhead001"}]
# PEP 639 form: an SPDX expression rather than the legacy {text = "MIT"}
# free-text field. license-files is explicit rather than relying on
# setuptools' default LICEN[SC]E* glob, so the packaged file is a stated
# contract, not an accident of what the glob happens to match. The
# corresponding "License :: OSI Approved :: MIT License" classifier is
# deliberately gone: setuptools>=77 treats a Trove license classifier
# alongside an SPDX license expression as a build error (they'd otherwise be
# two descriptions of the same fact that could silently disagree), and the
# SPDX expression is what tooling should read now.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["hydrology", "flood-frequency", "bulletin-17c", "usgs", "streamflow"]
dependencies = [
    # Floors raised from the pre-3.11 values (numpy>=1.20, pandas>=1.3,
    # matplotlib>=3.4, scipy>=1.7) found during the pre-publish security
    # review: none of those versions ship a cp311 wheel, so on the actual
    # >=3.11 floor set in requires-python above, installing "flowfreq" with
    # no other constraints would try to build them from source and likely
    # fail. These are each package's first release with a cp311 wheel;
    # verified with `pip download --python-version {3.11,3.12,3.13,3.14}
    # --only-binary=:all:` against each floor, resolving cleanly on all four.
    "numpy>=1.23.2",
    "pandas>=1.5.0",
    "matplotlib>=3.6.1",
    "scipy>=1.9.2",
    # >=2.33.0: closes every requests CVE found in the pre-publish security
    # review -- 2.31.0's Proxy-Authorization header leak on cross-origin
    # redirect, 2.32.4's .netrc credential leak via crafted URL parsing, and
    # 2.33.0's own predictable-tempfile fix in extract_zipped_paths() (unused
    # here, but free to clear). This briefly had to be capped at 2.32.5
    # because 2.33.0 requires Python >=3.10 and the floor here was still 3.9;
    # now that the floor is 3.11, that constraint is gone.
    "requests>=2.33.0",
    "click>=8.0",
    # >=14.0.1: versions 0.14.0-14.0.0 carry CVE-2023-47248, arbitrary code
    # execution via crafted Parquet/Feather/IPC input through PyExtensionType
    # autoload. flowfreq.flowio.load_flow_frame wraps pd.read_parquet, which
    # uses pyarrow as its engine -- loading a file from anyone but yourself
    # is the exact vulnerable path this closes.
    "pyarrow>=14.0.1",
    # Pure Python, no compiled extension. flowfreq._p3_moments needs it for
    # the var_mom port's truncated-moment computation: at-site skew near
    # zero (the common case) makes the Pearson III shape parameter
    # alpha = 4/skew**2 large enough (Big Sandy: ~9e4) that float64 loses
    # the moment computation to cancellation. See _GAMMA_MOMENT_DPS there.
    "mpmath>=1.2",
]

[project.urls]
Homepage = "https://github.com/pinhead001/flowfreq"
Repository = "https://github.com/pinhead001/flowfreq"
Changelog = "https://github.com/pinhead001/flowfreq/blob/main/CHANGELOG.md"
Issues = "https://github.com/pinhead001/flowfreq/issues"

[project.optional-dependencies]
dev = [
    # >=8.0,<9: pip-audit flagged the previous <8 floor (pytest 7.4.4 resolved)
    # as carrying PYSEC-2026-1845, fixed in 9.0.3. Capped below 9 rather than
    # raised all the way: pytest 9.1 turns pytest.importorskip's ImportError
    # handling into a hard error by default. Confirmed live, not just from the
    # 8.4.2 warning, when a dependabot PR (#18) proposed raising this cap: CI's
    # `test` job (extension absent) failed on all four Python versions with
    # ModuleNotFoundError, not a clean skip, across five parity test modules --
    # test_fortran_oracles.py, test_live_cli_compare.py,
    # test_live_compare_engines.py, test_live_interval_builder.py,
    # test_live_vs_golden.py -- more than this comment used to claim ("two").
    # Do not merge a pytest>=9 bump until those are updated for the new
    # importorskip behavior. Verified full suite unchanged (810 passed) on
    # pytest 8.4.2 + pytest-cov 5.0 before raising the floor.
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<8",
    "black>=24.0,<27",
    "isort>=5.12,<10",
    "bump2version>=1.0.0,<2",
    # No upper bound: <2 is what made CI install 1.x while a developer on 2.x
    # saw different behaviour from the same config.
    "mypy>=1.8",
    "pandas-stubs",
    "types-requests",
]

[project.scripts]
flowfreq = "flowfreq.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["flowfreq*"]

[tool.setuptools.package-data]
# py.typed is the PEP 561 marker. Without it a downstream type checker ignores
# every annotation in this package, so the type hints are invisible to the
# people they exist for.
#
# The gage table used to be shipped as "../data/*.csv" from a top-level data/
# directory, a package-data entry reaching outside the package it belongs to.
# It happened to work; it is not contractual, and it forced data* into
# packages.find above. The file now lives in flowfreq/data/ where it is
# addressed normally.
"flowfreq" = ["data/*.csv", "py.typed"]
# Benchmark cases must ship with the package: flowfreq benchmark used to read
# them out of tests/, which is not packaged, so the command failed for every
# installed user.
"flowfreq.validation" = ["data/*.json"]

[tool.mypy]
# No python_version pin. Historical note now that the floor is 3.11: this was
# forced, not a preference, when the floor was 3.9 -- setting python_version =
# "3.9" made mypy parse *dependency* source under 3.9 grammar too, and click
# uses a match statement (3.10+), so the run died on click/utils.py before
# checking any of our own code. mypy 2.x also refused a "3.9" setting outright
# (3.10 is its own floor), which is how this passed locally on 2.3.1 while
# failing CI on the 1.x the dev extra pinned: 2.x warned and ignored the
# setting, 1.x honoured it and broke. That specific conflict is gone at 3.11
# (match statements parse fine), but there is still no strong reason to pin
# it: the test matrix is what actually verifies version-specific behavior,
# and an unpinned mypy just checks against whatever interpreter runs it.
ignore_missing_imports = true
# Enforced on the modules that already pass, so no NEW type error can land in
# them. The library ships py.typed, which tells every downstream checker to
# trust these annotations -- that promise is worth something only if something
# checks it.
#
# The modules listed below still carry errors inherited from before mypy ran
# here at all (14 files). They are exempted individually rather than by
# loosening the global settings, so the debt is countable and shrinks by
# deleting a stanza: pick a module, fix it, remove its override. Nothing new
# gets added to this list -- a new module is checked by default.
#
# Deliberately not fixed wholesale: over 200 errors concentrated in the
# numerical core, which is validated against the vendored Fortran to 1e-8. A
# large mechanical retype there risks a behaviour change no type checker would
# catch, for a benefit no user sees.

[[tool.mypy.overrides]]
module = "flowfreq"
ignore_errors = true

[[tool.mypy.overrides]]
module = "flowfreq._var_mom"
ignore_errors = true

[[tool.mypy.overrides]]
module = "flowfreq.batch"
ignore_errors = true

[[tool.mypy.overrides]]
module = "flowfreq.bulletin17c"
ignore_errors = true

[[tool.mypy.overrides]]
module = "flowfreq.flowio"
ignore_errors = true

[[tool.mypy.overrides]]
module = "flowfreq.freq_plot"
ignore_errors = true

[[tool.mypy.overrides]]
module = "flowfreq.hydrograph"
ignore_errors = true

[[tool.mypy.overrides]]
module = "flowfreq.lowflow"
ignore_errors = true

[[tool.mypy.overrides]]
module = "flowfreq.regime"
ignore_errors = true

[[tool.mypy.overrides]]
module = "flowfreq.report"
ignore_errors = true

[[tool.mypy.overrides]]
module = "flowfreq.usgs"
ignore_errors = true

[[tool.mypy.overrides]]
module = "flowfreq.validation.benchmarks"
ignore_errors = true

[[tool.mypy.overrides]]
module = "flowfreq.validation.reference"
ignore_errors = true

[[tool.mypy.overrides]]
module = "flowfreq.workflow"
ignore_errors = true

[tool.black]
line-length = 100
# py314 deliberately not listed: black<25 (pinned in the dev extra, see its
# comment) doesn't recognize it as a target and errors outright ("not one of
# 'py33'...'py313'"), which broke `ci / lint` and the v0.7.0 release run.
# black has no py314-specific formatting rules yet -- 3.14 introduces no new
# syntax relevant to formatting decisions over 3.13 -- so omitting it changes
# no output; it only stops black itself from refusing to run.
target-version = ['py311', 'py312', 'py313']

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["flowfreq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# The default selection IS the CI selection, so a bare `pytest` is correct on
# every platform with nothing to remember and no `make` required. Override from
# the CLI when you want the excluded tests: `-m ""` runs everything,
# `-m requires_network` runs only those. A later -m always wins.
#
# requires_peakfqr_testdata is deliberately NOT excluded: the reference data is
# vendored at vendor/peakfqr/inst/testdata, those tests pass, and
# tests/fixtures/paths.py skips them cleanly if it is ever absent.
#
# requires_peakfqsa is gone with flowfreq/peakfqsa: the marker gated two empty
# stub classes, so `pytest -m requires_peakfqsa` collected zero tests and both
# the marker and its exclusion were dead config.
addopts = "-v -m 'not requires_network'"
markers = [
    "requires_network: marks tests that contact live NWIS services (deselect with '-m \"not requires_network\"')",
    "requires_fortran: marks tests needing the f2py Fortran extension (auto-skipped when absent; build with python build_fortran/build.py)",
    "requires_peakfqr_testdata: marks tests needing the peakfqr reference test data, searched under vendor/peakfqr then ../_shared/peakfqr; auto-skipped when absent, see docs/FORTRAN_UPLOAD.md",
]
